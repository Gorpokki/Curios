name: Build the jar

# Builds the NeoForge jar on Linux and keeps it as a run artifact. Publishes nothing.
on:
  push:
    branches: [ci/build-jar]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./gradlew --no-daemon --init-script .github/pin-gradle-plugins.gradle :neoforge:build
      - name: Checksums
        run: sha256sum neoforge/build/libs/*.jar | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: curios-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
