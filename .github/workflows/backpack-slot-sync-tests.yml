name: Backpack slot sync tests

# Manual only. Runs the Curios slot sync GameTests with Sophisticated Backpacks as a test-only dependency.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gametests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEOFORGE: 21.1.248
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch Sophisticated Backpacks 3.25.78 and Sophisticated Core 1.4.90
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/backpack-libs" && cd "$RUNNER_TEMP/backpack-libs"
          curl -fsSLO https://cdn.modrinth.com/data/TyCTlI4b/versions/6apvKKGZ/sophisticatedbackpacks-1.21.1-3.25.78.2107.jar
          curl -fsSLO https://cdn.modrinth.com/data/nmoqTijg/versions/zvRSOlro/sophisticatedcore-1.21.1-1.4.90.2299.jar
          sha1sum -c <<'EOF'
          74192fd0039ead9680a5ede09889dae5b8f19ca7  sophisticatedbackpacks-1.21.1-3.25.78.2107.jar
          a7ab80bc6a5f069388325f552c8348a735dd6afb  sophisticatedcore-1.21.1-1.4.90.2299.jar
          EOF
      - name: Run GameTests
        shell: bash
        run: ./gradlew --no-daemon --init-script .github/pin-gradle-plugins.gradle :neoforge:runGameTestServer -Pneoforge_version="$NEOFORGE" -Pbackpack_libs="$RUNNER_TEMP/backpack-libs" 2>&1 | tee gametest.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '```'; grep -E 'failed at|required tests|\[backpack-slot-sync\]' gametest.log || echo 'no GameTest result lines'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
